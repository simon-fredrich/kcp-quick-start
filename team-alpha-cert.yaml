apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: team-alpha-cert
spec:
  commonName: team-alpha-admin
  issuerRef:
    name: kcp-front-proxy-client-issuer
    kind: Issuer
  secretName: team-alpha-cert
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - client auth
  subject:
    organizations:
      - team-alpha