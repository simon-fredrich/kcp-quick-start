apiVersion: operator.kcp.io/v1alpha1
kind: FrontProxy
metadata:
  name: frontproxy
spec:
  auth:
    serviceAccount:
      # if you want controllers to access particular workspaces using service accounts
      # serviceAccounts must be enabled, on all shards and the front-proxy.
      enabled: true
  rootShard:
    ref:
      # the name of the RootShard object created before
      name: root
  serviceTemplate:
    spec:
      # expose this front-proxy via a load balancer
      type: ClusterIP
      # hard code a specific cluster IP, e.g. for a kind setup.
      clusterIP: 10.96.100.100

  certificateTemplates:
    server:
      spec:
        dnsNames:
          # add localhost to the certificate.
          - localhost
        ipAddresses:
          # add localhost IPs to the server certificate.
          # this allows easy port-forward access.
          - 127.0.0.1
          - 127.0.0.2