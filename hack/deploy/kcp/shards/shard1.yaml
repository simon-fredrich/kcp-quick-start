apiVersion: operator.kcp.io/v1alpha1
kind: Shard
metadata:
  labels:
    app.kubernetes.io/name: kcp-operator
    app.kubernetes.io/managed-by: kustomize
  name: shard-01
spec:
  etcd:
    endpoints:
      - http://etcd-1.default.svc.cluster.local:2379
  rootShard:
    ref:
      name: root
  auth:
    serviceAccount:
      # if you want controllers to access particular workspaces using service accounts
      # serviceAccounts must be enabled, on all shards and the front-proxy.
      enabled: true
  deploymentTemplate:
    spec:
      template:
        spec:
          hostAliases:
            # add a hardcoded DNS override to the same IP as in frontproxy.yaml.
            # must match the RootShard's external.hostname (NOT "localhost").
            - ip: "10.96.100.100"
              hostnames:
                - kcp.quickstart.local